name: Build and Release

on:
  push:
	tags:
	  - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allows manual trigger from Actions tab
	inputs:
	  version:
		description: 'Release version (e.g., 1.0.0)'
		required: true
		default: '1.0.0'

jobs:
  build:
	runs-on: windows-latest

	steps:
	- name: Checkout code
	  uses: actions/checkout@v4

	- name: Setup MSBuild
	  uses: microsoft/setup-msbuild@v2

	- name: Setup NuGet
	  uses: nuget/setup-nuget@v2

	- name: Restore NuGet packages
	  run: nuget restore "4-Column Shopping List.csproj"

	- name: Build Release x86
	  run: msbuild "4-Column Shopping List.csproj" /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=bin\Release-x86\ /p:PlatformTarget=x86

	- name: Build Release x64
	  run: msbuild "4-Column Shopping List.csproj" /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\Release-x64\

	- name: Create Release Package x86
	  run: |
		$outputDir = "release-package-x86"
		New-Item -ItemType Directory -Path $outputDir -Force
		Copy-Item "bin\Release-x86\4-Column Shopping List.exe" -Destination $outputDir
		Copy-Item "bin\Release-x86\*.dll" -Destination $outputDir -ErrorAction SilentlyContinue
		Copy-Item "bin\Release-x86\*.config" -Destination $outputDir -ErrorAction SilentlyContinue
		Copy-Item "README.md" -Destination $outputDir -ErrorAction SilentlyContinue
		Compress-Archive -Path "$outputDir\*" -DestinationPath "4-Column-Shopping-List-x86.zip" -Force
	  shell: pwsh

	- name: Create Release Package x64
	  run: |
		$outputDir = "release-package-x64"
		New-Item -ItemType Directory -Path $outputDir -Force
		Copy-Item "bin\Release-x64\4-Column Shopping List.exe" -Destination $outputDir
		Copy-Item "bin\Release-x64\*.dll" -Destination $outputDir -ErrorAction SilentlyContinue
		Copy-Item "bin\Release-x64\*.config" -Destination $outputDir -ErrorAction SilentlyContinue
		Copy-Item "README.md" -Destination $outputDir -ErrorAction SilentlyContinue
		Compress-Archive -Path "$outputDir\*" -DestinationPath "4-Column-Shopping-List-x64.zip" -Force
	  shell: pwsh

	- name: Determine version
	  id: version
	  run: |
		if ("${{ github.event_name }}" -eq "workflow_dispatch") {
		  $version = "${{ github.event.inputs.version }}"
		} else {
		  $version = "${{ github.ref_name }}" -replace '^v', ''
		}
		echo "version=$version" >> $env:GITHUB_OUTPUT
		echo "tag=v$version" >> $env:GITHUB_OUTPUT
	  shell: pwsh

	- name: Create Release
	  uses: softprops/action-gh-release@v2
	  with:
		tag_name: ${{ steps.version.outputs.tag }}
		name: Release ${{ steps.version.outputs.tag }}
		body: |
		  ## 4-Column Shopping List ${{ steps.version.outputs.tag }}

	  ### Installation Instructions

	1. Download the appropriate version for your system:
	   - **4-Column-Shopping-List-x86.zip** - For 32-bit Windows systems
	   - **4-Column-Shopping-List-x64.zip** - For 64-bit Windows systems

	2. Extract the ZIP file to a folder on your computer

	3. Ensure you have the .NET 10 runtime installed for your platform if running from published binaries, or the .NET 10 SDK if building from source:
	   - Download from: https://dotnet.microsoft.com/en-us/download/dotnet/10

	4. Run **4-Column Shopping List.exe**

	### What's Changed

	- Update this section with your release notes

	### System Requirements

	- Windows 10 or later
	- .NET 10 runtime (or .NET 10 SDK for building from source)
	- x86 (32-bit) or x64 (64-bit) processor
		draft: false
		prerelease: false
		files: |
		  4-Column-Shopping-List-x86.zip
		  4-Column-Shopping-List-x64.zip
	  env:
		GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
